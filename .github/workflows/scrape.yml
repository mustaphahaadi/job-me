name: Scrape → Enrich → Match → Auto-Apply

on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual "Run now" trigger from the Sources page via GitHub API

# Never let two scheduled/manual runs overlap: they would race on job status
# transitions, auto-apply attempts, and source failure counters.
concurrency:
  group: job-me-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    name: Run pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium for auto-apply)
        run: npx playwright install --with-deps chromium
        working-directory: packages/scraper

      - name: Download fallback CV from Supabase Storage (optional)
        # auto-apply downloads each job's role-matched CV itself; this step only
        # seeds CV_FILE_PATH as a fallback for jobs that match no CV row.
        # Never fails the run — an empty or missing file just means no fallback.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          CV_FILE_PATH_DB=$(curl -fsSL \
            "${SUPABASE_URL}/rest/v1/cv_versions?select=file_path&order=uploaded_at.desc&limit=1" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Accept: application/json" \
            | python3 -c "import sys,json; rows=json.load(sys.stdin); print(rows[0]['file_path'] if rows else '')" || true)

          if [ -z "${CV_FILE_PATH_DB}" ]; then
            echo "No CV uploaded yet — auto-apply will skip (no file available)."
            exit 0
          fi

          echo "Resolved CV path from DB: ${CV_FILE_PATH_DB}"

          # Preserve the stored extension so legacy .doc/.docx CVs are not
          # renamed to .pdf (ATS uploads can reject mismatched extensions).
          CV_EXT=$(printf '%s' "$CV_FILE_PATH_DB" | sed 's/.*\.//' | tr '[:upper:]' '[:lower:]')
          case "$CV_EXT" in
            pdf|doc|docx) ;;
            *) CV_EXT=pdf ;;
          esac
          ENCODED_CV_PATH=$(python3 -c "import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))" "$CV_FILE_PATH_DB")

          if curl -fsSL \
            "${SUPABASE_URL}/storage/v1/object/cv-files/${ENCODED_CV_PATH}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -o "/tmp/resume.${CV_EXT}"; then
            echo "CV_FILE_PATH=/tmp/resume.${CV_EXT}" >> "$GITHUB_ENV"
          else
            echo "CV download failed — the pipeline will retry downloads per job."
          fi

      - name: Run pipeline (scrape → enrich → match → auto-apply)
        run: pnpm pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # CV_FILE_PATH is written to $GITHUB_ENV by the fallback-download step
          # and is inherited automatically; do not set it to an empty value here.
          # Applicant credentials for auto-apply connectors
          APPLICANT_FIRST_NAME: ${{ secrets.APPLICANT_FIRST_NAME }}
          APPLICANT_LAST_NAME: ${{ secrets.APPLICANT_LAST_NAME }}
          APPLICANT_EMAIL: ${{ secrets.APPLICANT_EMAIL }}
          APPLICANT_PHONE: ${{ secrets.APPLICANT_PHONE }}
          # Optional: enables AI cover letter generation and spam filtering (OpenRouter)
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Optional: override the default model (e.g. openai/gpt-4o-mini or google/gemini-2.5-flash)
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL || vars.OPENROUTER_MODEL || '' }}
          # Keep browser runs headless in CI. Set PLAYWRIGHT_HEADLESS=false locally to watch.
          PLAYWRIGHT_HEADLESS: 'true'
          # Unknown apply pages are routed to the manual queue unless this is
          # explicitly enabled. Safer default: never fill an arbitrary form.
          ALLOW_GENERIC_AUTO_APPLY: ${{ vars.ALLOW_GENERIC_AUTO_APPLY || 'false' }}
