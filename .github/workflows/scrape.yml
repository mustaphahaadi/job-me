name: Scrape → Match → Auto-Apply

on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual "Run now" trigger from the Sources page via GitHub API

jobs:
  pipeline:
    name: Run pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium for auto-apply)
        run: npx playwright install --with-deps chromium
        working-directory: packages/scraper

      - name: Download active CV from Supabase Storage
        # Queries cv_versions for the most recently uploaded file_path, then
        # downloads that exact file. No longer hardcoded to 'resume.pdf'.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          CV_FILE_PATH_DB=$(curl -fsSL \
            "${SUPABASE_URL}/rest/v1/cv_versions?select=file_path&order=uploaded_at.desc&limit=1" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Accept: application/json" \
            | python3 -c "import sys,json; rows=json.load(sys.stdin); print(rows[0]['file_path'] if rows else 'resume.pdf')")

          echo "Resolved CV path from DB: ${CV_FILE_PATH_DB}"

          curl -fsSL \
            "${SUPABASE_URL}/storage/v1/object/cv-files/${CV_FILE_PATH_DB}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -o /tmp/resume.pdf

          echo "CV_FILE_PATH=/tmp/resume.pdf" >> "$GITHUB_ENV"

      - name: Run pipeline (scrape → match → auto-apply)
        run: pnpm pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CV_FILE_PATH: ${{ env.CV_FILE_PATH }}
          # Applicant credentials for auto-apply connectors
          APPLICANT_FIRST_NAME: ${{ secrets.APPLICANT_FIRST_NAME }}
          APPLICANT_LAST_NAME: ${{ secrets.APPLICANT_LAST_NAME }}
          APPLICANT_EMAIL: ${{ secrets.APPLICANT_EMAIL }}
          APPLICANT_PHONE: ${{ secrets.APPLICANT_PHONE }}
          # Optional: enables AI cover letter generation and spam filtering
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

